<button aria-pressed="true" style="padding: 9px 14px; border-radius: 18px; border: 1px solid #2B55C7; background: #E7EDFA; color: #2B55C7; font-size: 15px; font-weight: 700">At a café or restaurant</button>

</div>

<button style="padding: 9px 14px; border-radius: 18px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #15171C; font-size: 15px">At the gym</button>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700; color: #5B616E">Social</span>

<button style="padding: 9px 14px; border-radius: 18px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #15171C; font-size: 15px">Compliments and thanks</button>

<button style="padding: 9px 14px; border-radius: 18px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #15171C; font-size: 15px">Asking for help</button>

<button style="padding: 9px 14px; border-radius: 18px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #15171C; font-size: 15px">“One more time, slowly”</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700; color: #5B616E">Emergencies</span>

<button style="padding: 9px 14px; border-radius: 18px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #15171C; font-size: 15px">Lost items</button>

<button style="padding: 9px 14px; border-radius: 18px; border: 1px solid #E3E5EA; background: #FFFFFF; color: #15171C; font-size: 15px">Police or ambulance</button>

<div style="flex-grow: 1"></div>
<button style="height: 54px; border-radius: 27px; border: none; background: #2B55C7; color: #FFFFFF; font-size: 17px; font-weight: 700">Suggest 5 phrases</button>
