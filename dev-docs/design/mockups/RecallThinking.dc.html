<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio recall, thinking gap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 62px 24px 40px; background: #0E1014; color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="End session" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; display: flex; align-items: center; justify-content: center; color: #F3F4F6; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.14)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 15px; font-weight: 700">Audio recall</span><span style="font-size: 13px; color: #9AA1AD">Bahasa Indonesia</span></div>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #F3F4F6; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14)">Slow</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center">
<div style="display: flex; flex-direction: column; gap: 14px; align-items: center">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #9AA1AD">ENGLISH</span>
<p style="margin: 0; font-size: 36px; line-height: 1.2; font-weight: 700; letter-spacing: -0.4px">I’m already on my way.</p>
</div>
<div aria-label="Thinking time" style="display: flex; gap: 14px">
<span style="width: 14px; height: 14px; border-radius: 7px; background: #4FC3B5"></span>
<span style="width: 14px; height: 14px; border-radius: 7px; background: #4FC3B5"></span>
<span style="width: 14px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.18)"></span>
</div>
<span style="font-size: 16px; color: #9AA1AD">Say it out loud</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12)"><div style="width: 60%; height: 4px; border-radius: 2px; background: #4FC3B5"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #9AA1AD"><span><span style="color: #F3F4F6; font-weight: 700">12</span> of 20 this session</span><span>148 in set</span></div>
<p style="margin: 6px 0 0; text-align: center; font-size: 13px; color: #9AA1AD">Hold anywhere to pause · swipe to skip</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() { return {}; }
}
</script>
</body>
</html>
